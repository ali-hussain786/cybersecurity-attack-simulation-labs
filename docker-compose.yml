services:
  backend:
    build:
      context: ./backend
    container_name: cyberlab-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
    restart: unless-stopped
    volumes:
      - /home/alihussain/.docker/desktop/docker.sock:/var/run/docker.sock
    networks:
      - cyberlab

  frontend:
    build:
      context: ./frontend
    container_name: cyberlab-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    restart: unless-stopped
    networks:
      - cyberlab

networks:
  cyberlab:
    external: true
